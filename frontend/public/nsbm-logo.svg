<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <!-- Primary Green Gradient -->
    <linearGradient id="nsbmPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A84D" />
      <stop offset="50%" stop-color="#00843D" />
      <stop offset="100%" stop-color="#005A29" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="nsbmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Inner Shield Glow -->
    <linearGradient id="shieldSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="crestShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#003517" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#crestShadow)">
    <!-- Outer Gold Trim Shield -->
    <path d="M120 12 L196 44 C196 122 168 184 120 216 C72 184 44 122 44 44 Z" 
          fill="url(#nsbmGold)" stroke="#B45309" stroke-width="1.5" />

    <!-- Main Shield Body -->
    <path d="M120 18 L190 48 C190 120 164 178 120 208 C76 178 50 120 50 48 Z" 
          fill="url(#nsbmPrimary)" stroke="#004D22" stroke-width="2" />

    <!-- Inner Shield Highlights & Border -->
    <path d="M120 24 L184 52 C184 116 160 172 120 200 C80 172 56 116 56 52 Z" 
          fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" stroke-dasharray="4 2" />

    <path d="M120 18 L190 48 C190 120 164 178 120 208 C76 178 50 120 50 48 Z" 
          fill="url(#shieldSheen)" />

    <!-- Laurels / Leaves of Green University (Left & Right) -->
    <!-- Left Branch -->
    <path d="M72 85 C66 95 68 115 82 125 C75 118 76 102 82 92 Z" fill="#A7F3D0" opacity="0.85" />
    <path d="M66 110 C62 122 68 140 84 148 C76 142 76 128 82 118 Z" fill="#A7F3D0" opacity="0.85" />
    <!-- Right Branch -->
    <path d="M168 85 C174 95 172 115 158 125 C165 118 164 102 158 92 Z" fill="#A7F3D0" opacity="0.85" />
    <path d="M174 110 C178 122 172 140 156 148 C164 142 164 128 158 118 Z" fill="#A7F3D0" opacity="0.85" />

    <!-- Central Emblem: Open Book of Knowledge -->
    <g transform="translate(120, 78)">
      <!-- Book Pages Outer -->
      <path d="M0 -6 C-12 -12 -28 -12 -38 -8 C-40 -4 -40 22 -38 24 C-28 20 -12 20 0 26 C12 20 28 20 38 24 C40 22 40 -4 38 -8 C28 -12 12 -12 0 -6 Z" 
            fill="#FFFFFF" />
      <!-- Book Pages Inner Binding -->
      <path d="M0 -4 C-10 -9 -24 -9 -34 -6 L-34 20 C-24 18 -10 18 0 23 C10 18 24 18 34 20 L34 -6 C24 -9 10 -9 0 -4 Z" 
            fill="#F8FAFC" />
      <!-- Spine & Bookmark Ribbon -->
      <path d="M0 -6 L0 26" stroke="#00843D" stroke-width="2" />
      <path d="M-2 24 L0 32 L2 24 Z" fill="url(#nsbmGold)" />

      <!-- Page Lines Left -->
      <line x1="-28" y1="-1" x2="-8" y2="-1" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
      <line x1="-28" y1="5" x2="-8" y2="5" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
      <line x1="-28" y1="11" x2="-12" y2="11" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />

      <!-- Page Lines Right -->
      <line x1="8" y1="-1" x2="28" y2="-1" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
      <line x1="8" y1="5" x2="28" y2="5" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
      <line x1="12" y1="11" x2="28" y2="11" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Heraldic Banner for NSBM -->
    <g transform="translate(120, 134)">
      <!-- Gold Ribbon Banner Background -->
      <path d="M-64 -2 L64 -2 L54 18 L-54 18 Z" fill="url(#nsbmGold)" stroke="#B45309" stroke-width="1" />
      <!-- Banner Tails -->
      <path d="M-64 -2 L-76 -8 L-70 12 L-54 18 Z" fill="#B45309" opacity="0.9" />
      <path d="M64 -2 L76 -8 L70 12 L54 18 Z" fill="#B45309" opacity="0.9" />

      <!-- NSBM Text -->
      <text x="0" y="13" text-anchor="middle" font-family="'Outfit', 'Arial Black', sans-serif" 
            font-size="16" font-weight="900" fill="#064E3B" letter-spacing="3.5">NSBM</text>
    </g>

    <!-- Subtitle: GREEN UNIVERSITY -->
    <text x="120" y="168" text-anchor="middle" font-family="'Inter', 'Arial', sans-serif" 
          font-size="8.5" font-weight="800" fill="#FFFFFF" letter-spacing="2.2" opacity="0.95">GREEN UNIVERSITY</text>

    <!-- Decorative Stars of Excellence -->
    <g fill="url(#nsbmGold)">
      <!-- Center Top Star -->
      <path d="M120 40 L121.5 44.5 L126 44.5 L122.5 47 L124 51.5 L120 49 L116 51.5 L117.5 47 L114 44.5 L118.5 44.5 Z" />
      <!-- Left Star -->
      <path d="M102 46 L103 49.5 L106.5 49.5 L103.8 51.5 L105 55 L102 53 L99 55 L100.2 51.5 L97.5 49.5 L101 49.5 Z" transform="scale(0.8) translate(22, 10)" />
      <!-- Right Star -->
      <path d="M138 46 L139 49.5 L142.5 49.5 L139.8 51.5 L141 55 L138 53 L135 55 L136.2 51.5 L133.5 49.5 L137 49.5 Z" transform="scale(0.8) translate(37, 10)" />
    </g>

    <!-- Ecological Leaf Symbol at Bottom Apex -->
    <g transform="translate(120, 186)">
      <path d="M0 -4 C6 -1 8 5 0 11 C-8 5 -6 -1 0 -4 Z" fill="#34D399" />
      <line x1="0" y1="-2" x2="0" y2="9" stroke="#005A29" stroke-width="0.8" />
    </g>
  </g>
</svg>
