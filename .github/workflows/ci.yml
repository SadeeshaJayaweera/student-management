name: NSBM EduSphere CI Quality Gates

on:
  push:
    branches: [ master, main, 'feature/**', 'security/**', 'hotfix/**' ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt greenlet

      - name: Validate Database Migrations (Alembic)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
          SECRET_KEY: ci-environment-secret-key-min-32-chars-long-test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run Backend Integration & Unit Tests (Pytest)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
          SECRET_KEY: ci-environment-secret-key-min-32-chars-long-test
          ENVIRONMENT: testing
        run: |
          pytest -v --durations=10

  frontend-quality:
    name: Frontend Build & TypeScript Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Strict TypeScript & Vite Production Build
        working-directory: frontend
        run: npm run build

  security-checks:
    name: Security Vulnerability & Code Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Scanners
        run: |
          pip install --upgrade pip
          pip install bandit

      - name: Static Security Analysis (Bandit)
        run: |
          bandit -r backend -x backend/static_dist -ll -ii || true
