<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer Shield / Crest -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00A34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00843D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Shield shape -->
  <path d="M100 10 L180 40 L180 100 Q180 160 100 190 Q20 160 20 100 L20 40 Z" 
        fill="url(#shieldGrad)" stroke="#006B30" stroke-width="2"/>
  
  <!-- Inner highlight -->
  <path d="M100 18 L172 44 L172 100 Q172 154 100 182 Q28 154 28 100 L28 44 Z" 
        fill="url(#innerGrad)" stroke="none"/>
  
  <!-- Inner border -->
  <path d="M100 25 L168 50 L168 100 Q168 150 100 178 Q32 150 32 100 L32 50 Z" 
        fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- Book icon -->
  <g transform="translate(100,70)" fill="white" opacity="0.9">
    <rect x="-22" y="-15" width="20" height="28" rx="2" fill="none" stroke="white" stroke-width="1.5"/>
    <rect x="2" y="-15" width="20" height="28" rx="2" fill="none" stroke="white" stroke-width="1.5"/>
    <line x1="-12" y1="-8" x2="-5" y2="-8" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="-12" y1="-3" x2="-5" y2="-3" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="-12" y1="2" x2="-5" y2="2" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="5" y1="-8" x2="19" y2="-8" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="5" y1="-3" x2="19" y2="-3" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="5" y1="2" x2="19" y2="2" stroke="white" stroke-width="1" opacity="0.6"/>
    <path d="M0 -16 L0 14" stroke="white" stroke-width="1.5"/>
  </g>
  
  <!-- NSBM text -->
  <text x="100" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" 
        font-size="32" font-weight="900" fill="white" letter-spacing="4">NSBM</text>
  
  <!-- Divider line -->
  <line x1="55" y1="130" x2="145" y2="130" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  
  <!-- GREEN UNIVERSITY text -->
  <text x="100" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" 
        font-size="10" font-weight="600" fill="rgba(255,255,255,0.85)" letter-spacing="3">GREEN UNIVERSITY</text>
  
  <!-- Leaf accent -->
  <g transform="translate(100,163)" opacity="0.7">
    <path d="M-8 0 Q0 -8 8 0 Q0 4 -8 0" fill="#90EE90" stroke="none"/>
    <line x1="0" y1="-2" x2="0" y2="3" stroke="#006B30" stroke-width="0.5"/>
  </g>
</svg>
